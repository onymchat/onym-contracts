[package]
name = "sha-fri"
version = "0.1.0"
edition = "2021"
description = "Prototype PQ FRI verifier for Soroban: BabyBear field arithmetic in plain WASM, SHA-256 Merkle commitments + Fiat-Shamir (host-accelerated on-chain via env.crypto().sha256), DEEP opening of a committed trace, multi-arity FRI folding, Merkle caps, proof-of-work grinding. Feasibility prototype for the hash-choice pivot away from the BN254 Poseidon2 host primitive — see pq/sha-fri-runner for the bench."
license = "MIT"
publish = false

[lib]
crate-type = ["rlib"]
doctest = false

# The verifier is no_std + alloc and has no soroban-sdk dependency:
# hashing goes through the `hash::Hasher` trait, so the on-chain
# contract plugs in the SHA-256 host fn and the off-chain prover plugs
# in the `sha2` crate. Both hash byte-identical inputs.
[features]
std = []
prover = ["std", "dep:sha2"]

[dependencies]
sha2 = { version = "0.10", default-features = false, optional = true }

[profile.release]
opt-level = 3
lto = true
