name: PR Build

# Per-flavor build + test on PRs. The `release.yml` workflow (manual
# dispatch) does the source-attested build for stellar.expert; this
# one is the faster CI signal during development.
#
# Three matrix jobs:
#   - plonk-contracts:  per-contract `cargo test --lib` + wasm32 build
#   - plonk-verifier:   on-chain verifier crate `cargo test`
#   - plonk-prover:     prover-side fixture-assert run. Without
#                       STELLAR_REGEN_FIXTURES=1, the test re-bakes
#                       VKs + canonical proofs and byte-compares them
#                       against the committed `.bin` fixtures consumed
#                       by `plonk/verifier/`. Any drift between the
#                       prover and the on-chain bytes — including a
#                       per-tier VK SHA-256 anchor change — fails the
#                       build immediately.
#
# Three PQ jobs (pq/):
#   - pq-sha-fri:    the STARK crate's tests at both challenge-field
#                    degrees (default BabyBear⁴ and `ext8`), including
#                    the bit-for-bit check against Plonky3's Poseidon2
#                    and the bundle-generator binaries.
#   - pq-contracts:  per-contract (and per-profile) tests with real
#                    proofs + wasm32 build.
#   - pq-metered:    builds the bench contract WASM and runs
#                    pq/sha-fri-runner, which verifies real proofs
#                    under the soroban-sdk metered host (catches
#                    regressions native tests can't see, e.g. a WASM-only
#                    behaviour difference or a CPU/memory blow-up).
#
# The PQ crates pin rustc 1.95.0 (with the wasm32v1-none target) in
# their rust-toolchain.toml; rustup honours it, so these jobs don't set
# RUSTUP_TOOLCHAIN. Their lockfiles are tracked so fresh resolutions
# can't drift (see #48).
#
# Third-party `uses:` are pinned to commit SHA (with the version tag
# in a trailing comment for human + Dependabot readability) so a
# tag-rewrite on those repos can't inject code into our CI runs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plonk-contracts:
    name: plonk / ${{ matrix.contract }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        contract:
          - sep-anarchy
          - sep-democracy
          - sep-oligarchy
          - sep-oneonone
          - sep-tyranny
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plonk/${{ matrix.contract }}/target
          key: pr-${{ matrix.contract }}-${{ hashFiles(format('plonk/{0}/Cargo.toml', matrix.contract), 'plonk/verifier/Cargo.toml') }}

      - name: cargo test --lib
        working-directory: plonk/${{ matrix.contract }}
        run: cargo test --lib

      - name: cargo build --release (wasm32v1-none)
        working-directory: plonk/${{ matrix.contract }}
        run: cargo build --release --target wasm32v1-none

  plonk-verifier:
    name: plonk / verifier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plonk/verifier/target
          key: pr-verifier-${{ hashFiles('plonk/verifier/Cargo.toml', 'plonk/verifier/Cargo.lock') }}

      - name: cargo test
        working-directory: plonk/verifier
        run: cargo test

  plonk-prover:
    name: plonk / prover (fixture assert)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Intentionally NOT setting RUSTUP_TOOLCHAIN — the prover crate's
    # rust-toolchain.toml pins 1.88.0 and rustup auto-installs that
    # channel on first cargo invocation. The contract crates override
    # to stable because stellar-cli v26 blocklists 1.91.0; the prover
    # has no such constraint.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        # `stable` here just gets rustup onto the runner; rustup then
        # honors plonk/prover/rust-toolchain.toml and pulls 1.88.0.

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plonk/prover/target
          key: pr-prover-${{ hashFiles('plonk/prover/Cargo.toml', 'plonk/prover/Cargo.lock', 'plonk/prover/src/circuit/plonk/baker.rs', 'plonk/verifier/tests/fixtures/**') }}

      - name: Assert fixtures match (no STELLAR_REGEN_FIXTURES)
        working-directory: plonk/prover
        # Without the env var, this test re-bakes per-tier VKs and
        # canonical proofs from the prover and byte-compares them to
        # the committed fixtures in plonk/verifier/tests/fixtures/.
        # Drift = build failure. README.md documents this contract.
        run: cargo test --release --lib plonk_verifier_fixtures_match_or_regenerate

  pq-sha-fri:
    name: pq / sha-fri (${{ matrix.field }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - field: BabyBear⁴
            features: prover
          - field: BabyBear⁸ (ext8)
            features: prover,ext8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        # rustup then honours pq/sha-fri/rust-toolchain.toml (1.95.0).

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pq/sha-fri/target
          key: pr-pq-sha-fri-${{ matrix.features }}-${{ hashFiles('pq/sha-fri/Cargo.toml', 'pq/sha-fri/Cargo.lock') }}

      - name: cargo test --release
        working-directory: pq/sha-fri
        # --release: the tests prove real STARKs, which is slow unoptimised.
        run: cargo test --release --features ${{ matrix.features }}

      - name: no_std verifier build (what contracts link)
        working-directory: pq/sha-fri
        run: cargo build --release --lib ${{ matrix.features == 'prover,ext8' && '--features ext8' || '' }}

  pq-contracts:
    name: pq / ${{ matrix.contract }}${{ matrix.features && format(' ({0})', matrix.features) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - contract: sep-anarchy
            features: ''
          - contract: sep-anarchy
            features: conjectured
          - contract: sep-tyranny
            features: ''
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pq/${{ matrix.contract }}/target
          key: pr-pq-${{ matrix.contract }}-${{ matrix.features }}-${{ hashFiles(format('pq/{0}/Cargo.toml', matrix.contract), format('pq/{0}/Cargo.lock', matrix.contract), 'pq/sha-fri/Cargo.toml') }}

      - name: cargo test --release --lib
        working-directory: pq/${{ matrix.contract }}
        run: cargo test --release --lib ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: cargo build --release (wasm32v1-none)
        working-directory: pq/${{ matrix.contract }}
        run: cargo build --release --target wasm32v1-none ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

  pq-metered:
    name: pq / metered bench (soroban host)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            pq/sha-fri-bench/target
            pq/sha-fri-runner/target
          key: pr-pq-metered-${{ hashFiles('pq/sha-fri/Cargo.toml', 'pq/sha-fri-bench/Cargo.lock', 'pq/sha-fri-runner/Cargo.lock') }}

      - name: Build bench contract WASM
        working-directory: pq/sha-fri-bench
        run: cargo build --release --target wasm32v1-none

      - name: Verify real proofs under the metered host
        working-directory: pq/sha-fri-runner
        # The runner panics if any honest proof is rejected on-chain or a
        # tampered proof / wrong epoch is accepted.
        run: |
          set -euo pipefail
          cargo run --release -- \
            ../sha-fri-bench/target/wasm32v1-none/release/pq_sha_fri_bench_contract.wasm \
            | tee metered.md
          cat metered.md >> "$GITHUB_STEP_SUMMARY"
