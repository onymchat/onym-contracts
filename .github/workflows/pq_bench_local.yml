name: PQ Bench (local)

# Manual-dispatch CPU-instruction bench for the PQ flavor against a
# self-hosted local Stellar network. Complements release_pq.yml's
# testnet bench:
#   * release_pq.yml runs at tag-time against testnet → produces
#     canonical XLM/stroop fees for the release notes.
#   * this workflow runs on demand against a local soroban-rpc →
#     produces stable per-op CPU instruction counts (no friendbot
#     rate-limits, no testnet protocol drift). Useful for catching
#     algorithmic regressions in the FRI verifier between releases
#     and for tracking how close FRI ops sit to the 100M
#     `tx_max_instructions` cap as the verifier crate evolves.
#
# Local-vs-testnet caveats:
#   * CPU instruction counts may diverge slightly between local and
#     testnet when their host protocol versions differ. Pin both the
#     stellar CLI (via STELLAR_VERSION) AND the quickstart image tag
#     to keep numbers comparable across runs.
#   * Storage rent / refundable-fee numbers WILL diverge from testnet
#     (different ledger parameters). Don't use this workflow's fee
#     numbers for the release body — that's release_pq.yml's job.
#
# Third-party `uses:` are pinned to commit SHA (with the version tag
# in a trailing comment) so a tag-rewrite on those repos can't inject
# code into bench runs — same posture as release_pq.yml.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to bench (branch / tag / SHA). Defaults to the dispatch ref.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  bench-gas-local:
    name: bench-gas (local network)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Same RUSTUP_TOOLCHAIN override as release_pq.yml: stellar-cli
      # v26.0.0's contract-build wrapper rejects rustc 1.91.0, and the
      # repo's rust-toolchain.toml files pin 1.92.0. Forcing `stable`
      # here means CI uses whatever stable is on the runner regardless
      # of those pins, keeping the contract build path resilient to
      # toolchain bumps.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: wasm32v1-none

      - name: Cache Rust build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: bench-gas-pq-local-rust-${{ hashFiles('pq/**/Cargo.toml') }}

      - name: Install stellar CLI
        env:
          # Same pin as release_pq.yml. Bump in lockstep with that
          # workflow so local and testnet runs stay byte-comparable
          # at the CLI surface.
          STELLAR_VERSION: '26.0.0'
          STELLAR_SHA256: '31c83db342d1184b31f6591e739950eb45756be46dcd7bb57e4f38e91ea32e84'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          tarball="$tmp/stellar-cli.tar.gz"
          curl -sSLf -o "$tarball" \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${STELLAR_SHA256}  ${tarball}" | sha256sum -c -
          tar -xz -C "$tmp" -f "$tarball"
          binary="$(find "$tmp" -maxdepth 3 -type f -name stellar -perm -u+x | head -1)"
          test -n "$binary" || { echo "no stellar binary in tarball" >&2; exit 1; }
          sudo install -m 0755 "$binary" /usr/local/bin/stellar
          rm -rf "$tmp"
          stellar --version

      - name: Start local Stellar network
        env:
          # `:future` tracks the latest protocol bump; `:testing`
          # follows testnet and lagged by one protocol in run
          # #25505338567, which surfaced as
          #   "contract protocol number is newer than host", 26
          # because pq/sep-anarchy reaches into Protocol 26's
          # `env.crypto_hazmat().poseidon2_permutation`.
          #
          # TODO: pin to a digest (`@sha256:...`) once a known-good
          # quickstart image is captured. The `:future` tag still
          # shifts as Stellar lands new protocol features, so
          # absolute CPU counts may drift between runs — pin a
          # digest before using this workflow as a regression gate.
          QUICKSTART_IMAGE: 'stellar/quickstart:future'
        run: |
          set -euo pipefail
          # `--local` boots a fresh standalone network; `--enable-soroban-rpc`
          # exposes soroban-rpc at /rpc. Friendbot is bundled at /friendbot.
          #
          # `--limits unlimited` lifts the per-tx CPU budget so the
          # bench can capture the actual instruction count for FRI
          # ops. Without it, run #25505702335 hit
          #   Error(Budget, ExceededLimit)
          # on `create_group` (~282M instructions vs the 100M
          # testnet/mainnet cap), and every downstream op then failed
          # with `GroupNotFound`. The point of this workflow is to
          # MEASURE the CPU cost, not to enforce the cap — the
          # renderer's `% of cap` column shows the headroom against
          # the 100M ceiling regardless of what the local node enforces.
          docker run -d \
            --name stellar-local \
            -p 8000:8000 \
            "$QUICKSTART_IMAGE" \
            --local --enable-soroban-rpc --limits unlimited

          # Probe BOTH stellar-rpc's `getHealth` AND nginx-proxied
          # friendbot. RPC alone isn't enough: in run #25505142449
          # getHealth went healthy ~30s before friendbot's upstream
          # was reachable through nginx, so the next step's curl to
          # /friendbot returned 502 Bad Gateway and failed.
          #
          # RPC: response is `{"result":{"status":"healthy",...}}`.
          # Friendbot: any non-5xx response counts as ready (a 400
          # "missing addr" reply proves the upstream is reachable;
          # 502/503/504 mean nginx routes the path but friendbot
          # isn't responding yet; 000 is curl-side failure).
          #
          # Why 180s: cold boot on ubuntu-latest can take ~90s for
          # core sync alone, plus another ~30s for friendbot.
          ready=0
          rpc_response=""
          fb_status=000
          for i in $(seq 1 90); do
            rpc_response="$(curl -sS -X POST \
              -H 'Content-Type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' \
              http://localhost:8000/rpc 2>/dev/null || true)"
            rpc_ok=0
            printf '%s' "$rpc_response" | grep -q '"status":"healthy"' && rpc_ok=1

            fb_status="$(curl -sS -o /dev/null -w '%{http_code}' \
              http://localhost:8000/friendbot 2>/dev/null || echo 000)"
            fb_ok=0
            case "$fb_status" in
              000|502|503|504) ;;
              *) fb_ok=1 ;;
            esac

            if [ "$rpc_ok" -eq 1 ] && [ "$fb_ok" -eq 1 ]; then
              echo "stellar-local ready after ${i} polls (~$((i * 2))s, rpc + friendbot up)"
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::stellar-local did not become ready in 180s"
            echo "--- last getHealth response ---"
            printf '%s\n' "$rpc_response"
            echo "--- last friendbot HTTP status ---"
            printf '%s\n' "$fb_status"
            echo "--- docker logs (tail 100) ---"
            docker logs --tail 100 stellar-local 2>&1 || true
            exit 1
          fi

      - name: Configure stellar CLI for local network
        run: |
          set -euo pipefail
          stellar network add local \
            --rpc-url http://localhost:8000/rpc \
            --network-passphrase "Standalone Network ; February 2017"

      - name: Generate + fund deployer key
        env:
          BENCH_DEPLOYER: bench-gas-pq-local-deployer
        run: |
          set -euo pipefail
          stellar keys generate "$BENCH_DEPLOYER" --network local --overwrite
          addr="$(stellar keys public-key "$BENCH_DEPLOYER")"
          echo "deployer: $addr"
          # Fund via the bundled friendbot. `stellar keys fund` may
          # not auto-discover the friendbot URL on a custom local
          # network, so call it directly — the response body is small
          # JSON we don't need to parse.
          curl -sSLf "http://localhost:8000/friendbot?addr=${addr}" >/dev/null
          # Confirm by re-resolving the account; if friendbot didn't
          # actually fund it, the bench's first invoke would fail
          # downstream with a less-clear error.
          stellar keys public-key "$BENCH_DEPLOYER" >/dev/null

      - name: Run gas benchmarks
        env:
          BENCH_NETWORK: local
          BENCH_DEPLOYER: bench-gas-pq-local-deployer
        run: |
          set -euo pipefail
          chmod +x scripts/bench-gas/run-pq.sh \
                   scripts/bench-gas/contracts/pq-sep-anarchy.sh
          bash scripts/bench-gas/run-pq.sh

      - name: Summarise CPU headroom
        # Surfaces the per-op CPU instruction counts and how close
        # they sit to the 100M `tx_max_instructions` cap. Currently
        # informational only — the FRI verify ops sit ~2.8x above
        # the cap at bench-scale parameters (log_n=6, num_layers=3,
        # num_queries=8), so a hard fail on >100% would block every
        # run. Once verifier optimisation work brings FRI ops under
        # the cap, flip this step to `exit 1` on any row over a
        # chosen threshold to gate regressions.
        run: |
          set -euo pipefail
          echo "::group::Per-op CPU vs 100M cap"
          jq -r '
            select(.row_type == "op" and .cpu_insns)
            | "\(.op)\t\(.cpu_insns)\t\((.cpu_insns / 100000000 * 100) | tostring | .[0:6])%"
          ' scripts/bench-gas/results-pq.jsonl \
            | column -t -s $'\t' -N "Op,CPU Insns,% of 100M cap"
          echo "::endgroup::"

          # Soft warning when any op exceeds the cap — emits a GH
          # Actions ::warning:: line that surfaces in the workflow
          # summary without failing the run.
          over_cap="$(jq -r '
            [select(.row_type == "op" and .cpu_insns and .cpu_insns > 100000000) | .op] | join(",")
          ' scripts/bench-gas/results-pq.jsonl | tr -d '\n')"
          if [ -n "$over_cap" ]; then
            echo "::warning::CPU instructions exceed tx_max_instructions=100M for: $over_cap (these ops would be infeasible on testnet/mainnet at current bench parameters)"
          fi

      - name: Upload bench artefacts (JSONL + rendered body)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pq-bench-local-${{ github.run_id }}
          path: |
            scripts/bench-gas/results-pq.md
            scripts/bench-gas/results-pq.jsonl
          if-no-files-found: error

      - name: Stop local Stellar network
        if: always()
        run: |
          docker logs stellar-local > stellar-local.log 2>&1 || true
          docker rm -f stellar-local || true

      - name: Upload local-network logs (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: stellar-local-logs-${{ github.run_id }}
          path: stellar-local.log
          if-no-files-found: ignore
